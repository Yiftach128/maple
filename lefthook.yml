# Hooks run on what is staged, not on the whole tree, so a commit is not held up
# by an unrelated file. Everything here also runs in CI: the hook is the fast
# signal, CI is the gate.

pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      run: gitleaks protect --staged --redact --verbose
      # A secret reaching a commit is the one failure that cannot be undone by a
      # later commit, so this runs on every file, not a glob.

    - name: eslint
      glob: "*.{ts,tsx,js,mjs}"
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}
      stage_fixed: true

    - name: prettier
      glob: "*.{ts,tsx,js,mjs,json,md,yml,yaml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

    - name: lockfile-has-no-mirror-urls
      glob: "pnpm-lock.yaml"
      # Installing behind a registry mirror can write that mirror's URLs into
      # the lockfile. They work on one machine and nowhere else.
      run: |
        grep -qoE 'https?://' pnpm-lock.yaml \
          && { echo "pnpm-lock.yaml contains a URL. Re-resolve against the public registry."; exit 1; } \
          || true

    - name: skill-links
      # Plugin skills are canonical; .claude/skills/<name> symlinks to each.
      # No glob: a staged deletion matches none, and a deleted skill is exactly
      # what leaves a link dangling. It reads the working tree, in milliseconds.
      run: node tools/skill-links/check.ts

    - name: commit-identity
      # Git falls back to the global identity when a repository sets none, which
      # is how a work address ends up in a history meant to be published. This
      # asks only that the identity be chosen deliberately, not which one it is.
      run: |
        git config --local user.email >/dev/null 2>&1 \
          || { echo "No repository-local commit identity is set. Choose the address you want published:"; \
               echo "  git config user.name  '<name>'"; \
               echo "  git config user.email '<email>'"; exit 1; }

commit-msg:
  jobs:
    - name: conventional-commit
      run: |
        head -1 "{1}" | grep -qE '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: .{1,}' \
          || { echo "Commit message must be conventional, e.g. 'feat(core): add media connector'."; exit 1; }

    - name: sign-off
      run: |
        grep -qE '^Signed-off-by: .+ <.+@.+>' "{1}" \
          || { echo "Missing DCO sign-off. Commit with 'git commit -s'."; exit 1; }

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck

    - name: changeset-level
      # Needs a base, which a commit does not have and a push does. CI runs the
      # same check against the pull request's base.
      run: node tools/changeset-level/check.ts --base origin/main

    - name: plugin-version
      # A change under plugins/maple needs a new plugin.json version; that
      # needs a base, which a push has and a commit does not.
      run: node tools/skill-links/check.ts --base origin/main
