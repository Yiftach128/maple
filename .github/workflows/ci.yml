name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to a pull request cancels the first run; main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Every job installs the same way, so a cache hit in one is a cache hit in all.
  STORE_PATH: ~/.pnpm-store

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The plugin-version step diffs against the merge base.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - name: Every plugin skill is symlinked into .claude/skills, and every skill is placed
        run: pnpm check:skill-links
      - name: A change to the plugin changes its version
        # Installed copies of the plugin update only when plugin.json's version
        # moves, so an edit without a bump never reaches them.
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm check:skill-links --base "$BASE"
      - name: No new suppressions
        # `--prune-suppressions` rewrites the file when an entry is no longer
        # needed. A diff here means the ratchet moved and was not committed.
        run: |
          pnpm lint:prune
          git diff --exit-code -- eslint-suppressions.json

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm test
      - name: Install Chromium for browser-mode tests
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: publint
        run: pnpm publint
      - name: Are the types wrong?
        # --profile esm-only: these packages publish ESM with an exports map and
        # no CJS entry, so node10 and CJS resolution are expected not to apply.
        run: pnpm attw
      - name: The examples prove what their READMEs say they prove
        # Builds both example applications and asserts on their output: tagged
        # on a preview build, and no data-maple- attribute anywhere in
        # production, in the server bundle as well as the client one.
        run: pnpm -r --filter "./examples/*" verify

  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No registry mirror URLs in the lockfile
        # A contributor installing behind a corporate registry mirror can get
        # that mirror's tarball URLs written into the lockfile. They resolve on
        # that machine and nowhere else, and integrity hashes verify content
        # regardless of host, so nothing else would catch it.
        #
        # pnpm records only integrity hashes for registry packages, so any URL
        # here is either a deliberate git/tarball dependency or a leaked mirror.
        # Both deserve a human deciding, which is why this fails rather than
        # rewriting.
        run: |
          found=$(grep -noE 'https?://[^ "'"'"',}]+' pnpm-lock.yaml \
                  | grep -vE 'https://registry\.npmjs\.org/' || true)
          if [ -n "$found" ]; then
            echo "::error::pnpm-lock.yaml contains non-registry URLs:"
            echo "$found"
            echo "Re-resolve against the public registry, or justify the dependency in the commit body."
            exit 1
          fi
          echo "No URLs in pnpm-lock.yaml."

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans history, not just the tip.
          fetch-depth: 0
      # The official action requires a paid licence for organisation accounts.
      # gitleaks itself is MIT, so it is installed and run directly.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the full history
        run: gitleaks git --redact --verbose --exit-code 1 .

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          # Merge commits carry no authored change; "Update branch" writes them unsigned.
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::$sha is missing a DCO sign-off"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign your commits with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi

  changeset-level:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          # The check diffs against the merge base, which a shallow clone lacks.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Docs-only changes ship no changeset
        # Node builtins only, so no install: README, skill and docs changes
        # never trigger a release, and never a minor one.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node tools/changeset-level/check.ts --base "$BASE"
